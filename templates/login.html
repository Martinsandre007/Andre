<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Management System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-container { max-width: 400px; margin-top: 100px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-wallet { width: 100%; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
        .btn-wallet img { width: 24px; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="login-container">
            <h2 class="text-center mb-4">Login</h2>

            <div id="auth-methods">
                <button id="connect-mm" class="btn btn-outline-primary btn-wallet">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Logo.svg" alt="MetaMask">
                    Connect MetaMask (EVM)
                </button>

                <button id="connect-enkrypt" class="btn btn-outline-info btn-wallet">
                    Connect Enkrypt (Sui)
                </button>

                <button id="connect-zklogin" class="btn btn-outline-dark btn-wallet">
                    Login with Sui zkLogin
                </button>

                <hr>

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password">
                </div>
                <button id="btn-login" class="btn btn-primary w-100">Traditional Login</button>
            </div>

            <div id="status" class="mt-3 text-center text-muted"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
